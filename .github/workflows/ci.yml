name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Hook and evaluation tests
        run: python -m pytest .claude/hooks docs/dogmas/eval scripts -q
      - name: Rule drift
        run: python .claude/hooks/rule_drift.py --all
      - name: Duplicate responses (new only)
        run: >
          python docs/dogmas/eval/scripts/check_duplicate_responses.py
          --baseline docs/dogmas/eval/fixtures/duplicate-response-baseline.json
          --strict
      - name: Installer smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/install"
          bash install-claude.sh "$RUNNER_TEMP/install"
          test -f "$RUNNER_TEMP/install/.claude/hooks/guard_pretooluse.py"
          test ! -e "$RUNNER_TEMP/install/docs/dogmas/eval"
